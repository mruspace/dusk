name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      # Reruns dusk and diffs the README's output blocks. It does not compare
      # docs/data.json or the SVGs byte for byte.
      - run: ./scripts/check-readme.sh --run
