<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" role="img" aria-labelledby="t d"><title id="t">How much the result depends on the assumptions</title><desc id="d">For each uncertain parameter, varied alone with the rest at default, the range of the shrinking quorum's useful work relative to fixed TMR and its wrong results relative to standby simplex.</desc><style>text{font-family:Charter,'Source Serif 4','Iowan Old Style','Palatino Linotype',Georgia,serif;fill:#44444c}.title{font-family:Futura,Jost,'Century Gothic','Avenir Next',Avenir,system-ui,sans-serif;font-weight:500;font-size:19px;fill:#16161a}.sub{font-size:13.5px}.label{font-size:14px;fill:#16161a}.note{font-size:12.5px;fill:#6f6f78}.tick{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#6f6f78;font-variant-numeric:tabular-nums}.value{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#44444c}.grid{stroke:#e3e3dd;stroke-width:1}</style><rect width="760" height="390" fill="#fafaf8"/><text class="title" x="0" y="24">How much the result depends on the assumptions</text><text class="sub" x="0" y="47">Each parameter varied on its own, the rest at default. 1,000 missions per point.</text><text class="sub" x="0" y="66">A line spans the results across that parameter's values. The vertical rule is the default run.</text><text class="label" x="0" y="149">Weibull shape</text><text class="tick" x="0" y="164">1 to 4</text><text class="label" x="0" y="189">Correlated deaths</text><text class="tick" x="0" y="204">0 to 0.6</text><text class="label" x="0" y="229">Salvaged spares</text><text class="tick" x="0" y="244">0 to 4</text><text class="label" x="0" y="269">Upset rate</text><text class="tick" x="0" y="284">1e-5 to 1e-2</text><text class="label" x="0" y="309">Self-check coverage</text><text class="tick" x="0" y="324">0.9 to 0.999</text><text class="label" x="0" y="349">Self-check throughput</