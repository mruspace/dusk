<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d"><title id="t">What autonomy adds, by how long ground support lasts</title><desc id="d">The shrinking quorum's useful work relative to fixed TMR with a ground team that commands the same fallback 30 days after it is needed. With no ground team the gain is about 1.33x; it falls as support lasts longer and reaches 1.00x if support never ends.</desc><style>text{font-family:Charter,'Source Serif 4','Iowan Old Style','Palatino Linotype',Georgia,serif;fill:#44444c}.title{font-family:Futura,Jost,'Century Gothic','Avenir Next',Avenir,system-ui,sans-serif;font-weight:500;font-size:19px;fill:#16161a}.sub{font-size:13.5px}.label{font-size:14px;fill:#16161a}.note{font-size:12.5px;fill:#6f6f78}.tick{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#6f6f78;font-variant-numeric:tabular-nums}.value{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#44444c}.grid{stroke:#e3e3dd;stroke-width:1}</style><rect width="760" height="400" fill="#fafaf8"/><text class="title" x="0" y="24">What autonomy adds, by how long ground support lasts</text><text class="sub" x="0" y="47">Shrinking quorum vs fixed TMR with a ground team that commands the same fallback. At 0, there is none.</text><text class="sub" x="0" y="66">Answer time barely matters: 1 day and 6 months give the same result. Band: 95% CI.</text><line class="grid" x1="52" y1="352.0" x2="736" y2="352.0"/><text class="tick" x="44" y="356.0" text-anchor="end">1.0x</text><line class="grid" x1="52" y1="290.0" x2="736" y2="290.0"/><text class="tick" x="44" y="294.0" text-anchor="end">1.1x</text><line class="grid" x1="52" y1="228.0" x2="736" y2="228.0"/><text class="tick" x="44" y="232.0" text-anchor="end">1.2x</text><line class="grid" x1="52" y1="166.0" x2="736" y2="166.0"/><text class="tick" x="44" y="170.0" text-anchor="end">1.3x</te