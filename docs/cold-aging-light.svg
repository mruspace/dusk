<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d"><title id="t">Cold standby, by how fast an unpowered spare ages</title><desc id="d">Useful work of cold standby relative to fixed TMR, for spares that age from 0.1 to 1.0 of the powered rate. It falls from 1.46x to 0.84x. It does more useful work than the shrinking quorum below a spare aging rate of about 0.20. Reference lines: the shrinking quorum at 1.34x and standby simplex at 0.84x.</desc><style>text{font-family:Charter,'Source Serif 4','Iowan Old Style','Palatino Linotype',Georgia,serif;fill:#44444c}.title{font-family:Futura,Jost,'Century Gothic','Avenir Next',Avenir,system-ui,sans-serif;font-weight:500;font-size:19px;fill:#16161a}.sub{font-size:13.5px}.label{font-size:14px;fill:#16161a}.note{font-size:12.5px;fill:#6f6f78}.tick{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#6f6f78;font-variant-numeric:tabular-nums}.value{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#44444c}.grid{stroke:#e3e3dd;stroke-width:1}.halo{paint-order:stroke;stroke:#fafaf8;stroke-width:4px;stroke-linejoin:round}</style><rect width="760" height="400" fill="#fafaf8"/><text class="title" x="0" y="24">Cold standby, by how fast an unpowered spare ages</text><text class="sub" x="0" y="47">Useful work vs fixed TMR, same hardware. At 1.0 a cold spare ages as fast as a powered one.</text><text class="sub" x="0" y="66">The aging rate is swept, not measured. Band: 95% CI.</text><line class="grid" x1="52" y1="352.0" x2="736" y2="352.0"/><text class="tick" x="44" y="356.0" text-anchor="end">0.8x</text><line class="grid" x1="52" y1="290.0" x2="736" y2="290.0"/><text class="tick" x="44" y="294.0" text-anchor="end">1.0x</text><line class="grid" x1="52" y1="228.0" x2="736" y2="228.0"/><text class="tick" x="44" y="232.0" text-anchor="end">1.2x</text><line class="grid" x1="52" y1="166.0" x2="736" y2="166.0"/><text class="tick" x="44" y="170.0" text-anchor="end">1.4x</text><line class="grid" x1="52" y1="104.0" x2="736" y2="104.0"/><text class="tick" x="44" y="108.0" text-anchor="end">1.6x</text><text class="tick" x="52.0" y="370" text-anchor="middle">0.1</text><text class="tick" x="128.0" y="370" text-anchor="middle">0.2</text><text class="tick" x="204.0" y="370" text-anchor="middle">0.3</text><text class="tick" x="280.0" y="370" text-anchor="middle">0.4</text><text class="tick" x="356.0" y="370" text-anchor="middle">0.5</text><text class="tick" x="432.0" y="370" text-anchor="middle">0.6</text><text class="tick" x="508.0" y="370" text-anchor="middle">0.7</text><text class="tick" x="584.0" y="370" text-anchor="middle">0.8</text><text class="tick" x="660.0" y="370" text-anchor="middle">0.9</text><text class="tick" x="736.0" y="370" text-anchor="middle">1.0</text><text class="note" x="736" y="390" text-anchor="end">spare aging rate</text><line x1="52" y1="184.6" x2="736" y2="184.6" stroke="#3a4a5a" stroke-width="2"/><text class="note halo" x="736" y="176.6" text-anchor="end">shrinking quorum, 1.34x</text><line x1="52" y1="339.7" x2="736" y2="339.7" stroke="#a3a3aa" stroke-width="1"/><text class="note halo" x="56" y="331.7">standby simplex, 0.84x</text><path d="M52.0,143.8C77.3,157.1 102.7,171.7 128.0,183.9C153.3,196.1 178.7,207.0 204.0,217.0C229.3,227.1 254.7,236.0 280.0,244.4C305.3,252.7 330.7,260.2 356.0,267.2C381.3,274.2 406.7,280.4 432.0,286.2C457.3,292.1 482.7,297.4 508.0,302.3C533.3,307.2 558.7,311.6 584.0,315.8C609.3,319.9 634.7,323.8 660.0,327.4C685.3,331.0 710.7,334.0 736.0,337.3L736.0,342.0C710.7,338.7 685.3,335.7 660.0,332.1C634.7,328.5 609.3,324.7 584.0,320.5C558.7,316.3 533.3,311.9 508.0,307.0C482.7,302.0 457.3,296.7 432.0,290.9C406.7,285.0 381.3,278.9 356.0,271.9C330.7,264.9 305.3,257.5 280.0,249.1C254.7,240.8 229.3,231.9 204.0,221.9C178.7,211.9 153.3,201.2 128.0,189.1C102.7,177.0 77.3,162.6 52.0,149.4Z" fill="#a3a3aa" fill-opacity="0.16"/